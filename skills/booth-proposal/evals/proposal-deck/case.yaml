schema_version: "1.1"
name: proposal-deck
expected_outcome: |
  The full run ends in Step 6: deck.py new builds pack/proposal.html (a Chinese deck), every TODO is filled,
  deck.py check reports PASS and deck.py render writes pack/proposal.pdf, newer than the HTML. The reply tells the
  user to send only pack/proposal.pdf. The deck is a design showcase built to the page plan in
  references/proposal-deck.md: cover, agenda, project (conference 9–11 March and exhibition 10–11 March apart, open
  sides worded as a design setting "暂按…", 4.5 m limit, a site diagram pack/site.svg drawn by deck.py), what the brief
  asks (plain language, every answering page), insight with a source line, what the booth says, overview, per concept
  board, front only when a usable front render exists, detail with "为什么值得选", compare (创意 / 感受 / 最强的画面 /
  适合想要…的客户 / 深化方向), the lead concept's zones, materials, screens and products, interaction, hospitality and
  branded items, no graphic page without boards (the response table says 另行提交), and an appendix of at most three
  pages. It shows only the studio's own images and the logo from deck-style.json, never previous-stand.png, and never
  narrates the previous stand. No IDs, citations, file names, TODOs, PASS/FAIL, placeholders, assumptions table,
  ideas table, staffing, schedule, pricing, power or fire items appear anywhere. The 1981 "first in Europe" and the
  "more than 40 countries" claims carry 需客户确认 wherever used and are listed in the appendix with their pages.
  Without an image key the deck is still built (split cover with the site diagram, no front pages) and the same
  rules hold.
context:
  scaffold_script: place-files.sh
