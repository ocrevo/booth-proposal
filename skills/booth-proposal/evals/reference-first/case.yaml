schema_version: "1.1"
name: reference-first
expected_outcome: |
  The client's previous stand (previous-stand.png, a deep green arch) is a design input. The skill
  looks at the image and names what the client loves in it. Concepts may evolve the arch (the RFP asks to build on
  what people recognise), each pushed in a different direction and made clearly more premium, and at least one
  concept starts from somewhere else. Every View 1 render command (or the prompt pack) attaches previous-stand.png
  as a reference image (render.py hero --ref), and each View 1 prompt carries one short line on what to keep and
  evolve and what not to copy, with no written description standing in for the image. The proposal never shows
  previous-stand.png and never narrates it: each concept is described on its own merit.
context:
  scaffold_script: place-files.sh
